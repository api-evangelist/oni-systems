name: Oni Systems
description: ONI Systems Inc. was an optical networking equipment company that built optical
  switching and transport systems for metropolitan-area networks during the fiber-optic boom of the
  late 1990s and early 2000s. Backed by Canaan Partners and other venture investors, the company went
  public and was acquired by Ciena Corporation in 2002, after which its product line was absorbed into
  Ciena's metro optical portfolio. It operated as an equipment maker and has no standalone developer
  program, public API surface, SDKs, or online documentation of its own. This profile is retained in
  the API Evangelist network as a historical/defunct portfolio-lead record.
